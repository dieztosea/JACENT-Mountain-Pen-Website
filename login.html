<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Jacent Fine Writing Instruments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <nav class="auth-nav">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon"><img src="images/login_signup logo.png" alt="Jacent Logo"></div>
      Jacent
    </a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">

      <!-- Left Panel -->
      <div class="auth-left">
        <div class="auth-left-logo">
          <img src="images/login_signup logo.png" alt="Jacent Logo">
        </div>
        <h1 class="auth-left-title">Jacent</h1>
        <p class="auth-left-desc">
          Writing instruments for those who care. An upscale boutique for fountain
          pen enthusiasts, from first-time buyers to serious collectors.
        </p>
        <div class="auth-left-hero">
          <span class="auth-welcome-label">Welcome</span>
          <span class="auth-welcome-sub">To Jacent</span>
        </div>
        <p class="auth-tagline">"Ink That Speaks Elegance."</p>
        <div class="auth-social-icons">
          <a href="#" title="Instagram"><i class="ri-instagram-line"></i></a>
          <a href="#" title="Facebook"><i class="ri-facebook-circle-line"></i></a>
          <a href="#" title="TikTok"><i class="ri-tiktok-line"></i></a>
          <a href="#" title="Google"><i class="ri-google-line"></i></a>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="auth-right">
        <p class="auth-eyebrow">Ascent to beauty!</p>
        <h2 class="auth-right-title">Log In to JACENT</h2>

        <!-- error msg -->
        <div class="auth-error" id="auth-error" style="display:none"></div>

        <form id="login-form" onsubmit="handleLogin(event)" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email"
                     placeholder="you@example.com" autocomplete="email" required>
              <span class="input-icon"><i class="ri-mail-line"></i></span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password"
                     placeholder="••••••••••••••••" autocomplete="current-password" required>
              <span class="input-icon" id="toggle-pass" onclick="togglePassword()" style="cursor:pointer">
                <i class="ri-eye-off-line" id="eye-icon"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn-auth" id="login-btn">
            Log In <i class="ri-user-line"></i>
          </button>
        </form>

        <div class="auth-or">or</div>

        <div class="social-login">
          <button class="social-btn" title="Facebook"><i class="ri-facebook-fill"></i></button>
          <button class="social-btn" title="Google"><i class="ri-google-fill"></i></button>
          <button class="social-btn" title="LinkedIn"><i class="ri-linkedin-fill"></i></button>
        </div>

        <p class="auth-switch">
          Don't have an account? <a href="signup.html" id="signup-link">Sign Up</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // if already logged in, go straight to destination
    if (Auth.isLoggedIn()) Auth.redirectAfterAuth('index.html');

    const params = new URLSearchParams(location.search);
    if (params.get('redirect')) sessionStorage.setItem('jacent-redirect', params.get('redirect'));

    // redirect to sign up
    const signupLink = document.getElementById('signup-link');
    const savedRedirect = sessionStorage.getItem('jacent-redirect');
    if (savedRedirect) signupLink.href = 'signup.html';   

    const togglePassword = () => {
      const input  = document.getElementById('password');
      const icon   = document.getElementById('eye-icon');
      const isPass = input.type === 'password';
      input.type   = isPass ? 'text' : 'password';
      icon.className = isPass ? 'ri-eye-line' : 'ri-eye-off-line';
    };

    const showError = (msg) => {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    };

    const handleLogin = (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      const btn   = document.getElementById('login-btn');

      document.getElementById('auth-error').style.display = 'none';

      if (!email || !pass) { showError('Please fill in all fields.'); return; }

      btn.innerHTML = '<i class="ri-loader-4-line" style="animation:spin 1s linear infinite;display:inline-block"></i> Logging in...';
      btn.disabled  = true;

      // added: delay 
      setTimeout(() => {
        const result = Auth.login(email, pass);
        if (result.ok) {
          Auth.redirectAfterAuth('index.html');
        } else {
          btn.innerHTML = 'Log In <i class="ri-user-line"></i>';
          btn.disabled  = false;
          showError(result.error);
        }
      }, 700);
    };
  </script>
</body>
</html>
